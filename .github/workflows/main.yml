name: Mule CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Verify Versions
        run: |
          java -version
          mvn -version

      - name: Build Mule Application
        working-directory: ./accounts-api
        run: mvn clean package -Dmule.key=${{ secrets.MULE_KEY }}
